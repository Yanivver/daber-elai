<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>דבר אלי</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; overscroll-behavior: none;
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }
  a { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
</style>
</head>
<body>
  <a href="/app" aria-label="Entrer dans דבר אלי"><img src="/splash.png" alt="דבר אלי" draggable="false" /></a>
  <script>
    // Bloque le défilement, le zoom (pincement et double-tap) sur iPhone
    const stop = (e) => e.preventDefault();
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, stop, { passive: false }));
    document.addEventListener('touchmove', stop, { passive: false });
    document.addEventListener('dblclick', stop, { passive: false });
    let last = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - last < 350) e.preventDefault();
      last = now;
    }, { passive: false });
  </script>
</body>
</html>
